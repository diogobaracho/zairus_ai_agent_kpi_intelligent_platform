# One ingress with path routing. SSE needs unbuffered responses and a long read timeout on your
# ingress controller (nginx annotations shown; adapt for others).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kpi-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: chat-web, port: { number: 8080 } } }
    - host: mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: mcp, port: { number: 8090 } } }
    - host: www.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: website, port: { number: 8080 } } }
