# Generic, provider-agnostic manifests. Set the image registry/tag with kustomize `images:`
# and provide the Secret from your platform's secret store (see secret.example.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kpi-platform
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - mcp.yaml
  - api.yaml
  - chat-web.yaml
  - website.yaml
  - ingress.yaml
images:
  - name: kpi-api
    newName: ghcr.io/example/kpi-api
    newTag: "0.1.0"
  - name: kpi-mcp
    newName: ghcr.io/example/kpi-mcp
    newTag: "0.1.0"
  - name: kpi-migrate
    newName: ghcr.io/example/kpi-migrate
    newTag: "0.1.0"
  - name: kpi-chat-web
    newName: ghcr.io/example/kpi-chat-web
    newTag: "0.1.0"
  - name: kpi-website
    newName: ghcr.io/example/kpi-website
    newTag: "0.1.0"
