# Serves the SPA and proxies /api to the API with SSE-friendly settings.
# Rendered by the nginx image's envsubst at start-up: API_UPSTREAM defaults to http://api:8080
# (use a fully qualified name on Kubernetes, the resolver does not apply search domains).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Resolve the API per request (not at start-up) so the chat can boot before, or without, it.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_buffering off;          # SSE: forward events as they are produced
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
        add_header Cache-Control "no-cache";
    }
}
