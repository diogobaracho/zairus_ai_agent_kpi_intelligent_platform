apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  ports: [{ port: 8090, targetPort: 8090 }]
  selector: { app: mcp }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp } }
  template:
    metadata: { labels: { app: mcp } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: mcp
          image: zairus-mcp
          ports: [{ containerPort: 8090 }]
          envFrom:
            - configMapRef: { name: kpi-config }
            - secretRef: { name: kpi-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
