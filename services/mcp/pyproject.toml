[project]
name = "kpi-mcp"
version = "0.1.0"
description = "KPI Intelligent Platform - FastMCP server exposing KPI tools to AI agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kpi-core",
    "fastmcp>=4.0,<5",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
kpi-mcp = "kpi_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpi_mcp"]
